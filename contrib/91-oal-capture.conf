[Service]
# Loads the OAL capture layer into SteamVR (via vulkan.env). Remove this file and
# run `systemctl --user daemon-reload && systemctl --user restart steamvr.service`
# to take OAL out of the picture completely.
EnvironmentFile=-%h/.config/oal-frame/vulkan.env
ExecStartPre=-%h/.local/libexec/oal-guard start
ExecStopPost=-%h/.local/libexec/oal-guard stop
