; OpenVR Ambient Light for Steam Frame - settings
; Same names and defaults as the Windows app's [Main] and [AdaLight] sections,
; so you can copy values over. The daemon reloads this file when you save it.

[Main]
EnableLights = true
; Updates per second sent to the LEDs (the layer captures at 30 Hz by default)
SampleRate = 144
NumLights = 24

SwapLeftRight = true
BottomToTopLeft = false
BottomToTopRight = true

; Where each LED samples (see `oalctl snapshot`):
;   edge - a thin strip just inside the visible lens edge, at the LED's height. The edge shape is
;          learned from what has been shown (oalctl reset-edge forgets it). HorizontalOffset,
;          WidthFraction and Curvature are not used in this mode.
;   box  - OAL's original boxes
SampleMode = edge
; strip thickness and how far in from the edge to start, in fractions of an eye's width.
; One capture cell is about 0.0075 of an eye's width with OAL_CAPTURE_GRID=270 (the default in
; ~/.config/oal-frame/vulkan.env), or 0.03 with 128. Each setting rounds to whole cells, and
; EdgeDepth is always at least one cell. Raise EdgeDepth if the LEDs flicker on busy edges; raise
; EdgeInset if the outermost cells look too dim (they straddle the lens edge).
EdgeDepth = 0.03
EdgeInset = 0.0075

; Sample area geometry, in fractions of each eye's image. In edge mode only the vertical
; settings (HeightFraction, VerticalOffset, VerticalAreaSize) matter.
HeightFraction = 0.85
WidthFraction = 0.05
VerticalOffset = -0.1
HorizontalOffset = 0.13
VerticalAreaSize = 1
Curvature = 0.12
CurvatureShape = 0.12

; Colour
Brightness = 1.5
MinBrightness = 0.01
BlackLevel = 0.004
; Dim the LEDs together with the headset's display brightness (SteamVR's analogGain setting).
; LED brightness = Brightness x (panel brightness / PanelBrightnessReference). Raise the reference
; above 1.0 if the LEDs should already be dimmer at full panel brightness. If SteamVR can't be
; reached, the LEDs keep their last (or configured) brightness.
FollowPanelBrightness = true
PanelBrightnessReference = 1.0
Contrast = 1.0
Saturation = 1
MinRed = 0.0
MinGreen = 0.0
MinBlue = 0.0
MaxRed = 1.0
MaxGreen = 1.0
MaxBlue = 1.0
GammaRed = 1
GammaGreen = 1
GammaBlue = 1

[Output]
; serial = Adalight over USB serial, udp = over Wi-Fi to firmware/oal_led_udp (or WLED)
Output = udp

[AdaLight]
; Linux device name of the LED controller (Windows used ComPort = COM3 etc.)
SerialPort = /dev/ttyACM0
BaudRate = 115200

[UDP]
; The board's hostname (oal-led.local from the firmware) or its IP address
UdpHost = oal-led.local
UdpPort = 21324
; adalight - 8-bit, firmware/oal_led_udp (or any Adalight receiver)
; oal16    - 16-bit with dithering and LED colour correction, firmware/oal_led_udp_dither
;            (flash that first: older firmware ignores oal16 packets and the LEDs stay dark)
; drgb     - WLED realtime protocol
UdpProtocol = oal16

; The settings below apply with UdpProtocol = oal16 only.
; Temporal dithering on the controller: dim colours fade smoothly and keep their hue.
; Turn it off if you notice flicker in the corner of your eye.
Dither = true
; Levels below this fraction of one 8-bit step are shown as off, so near-black doesn't sparkle
DitherCutoff = 0
; White balance, 0..1 per channel. Tune with `oalctl calibrate` until LED white matches a
; white screen. The defaults aim at a neutral (D65) white using measured emitter brightness
; (full green is ~4x as bright as full red or blue). The 8-bit firmware used 1.0 / 0.69 / 0.94,
; which is noticeably bluer.
LedWhiteRed = 1.0
LedWhiteGreen = 1
LedWhiteBlue = 1
; Converts screen (sRGB) colours to the LEDs' purer red/green/blue (measured primaries), so
; hues match the panel. The few screen colours the LEDs can't reach (near pure blue) get a
; dash of neutral light instead of a hue shift. 0 = off, 1 = full.
LedGamut = 1.0

[Frame]
; How each eye is found in what the compositor presents:
;   auto       - pick automatically (see `oalctl status` for what it chose)
;   split      - one image, left half = left eye, right half = right eye
;   layers     - one image with two array layers
;   swapchains - two images; set LeftView/RightView to the view numbers from `oalctl status`
ViewMode = auto
LeftView = -1
RightView = -1
; The Steam Frame's panel image is upside down and mirrored inside each eye. 180 turns each eye
; upright before sampling, so "outer edge" really is the outer edge. Use 0 for other headsets.
; If the LED order then looks upside down, toggle BottomToTopLeft / BottomToTopRight.
EyeRotation = 180
; auto | linear | srgb - how to interpret captured values (auto is right unless colours look washed out or too dark)
InputEncoding = auto
; 0 = off. Up to 0.95 for heavier temporal smoothing (less flicker, more lag)
Smoothing = 0.8
; LEDs switch off when nothing new has been presented for this long
IdleTimeoutMs = 3000
; SteamVR's client library, used only to read the panel brightness
OpenVRLibrary = /opt/steamvr/bin/linuxarm64/libopenvr_api.so
